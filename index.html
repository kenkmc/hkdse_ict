<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/platform.css?v=4">
    <link rel="stylesheet" href="assets/css/viewport-fixes.css?v=1" data-viewport-fixes="true">
    <meta name="description" content="HKDSE ICT 課程、互動模擬器及學習工具。">
    <title>高中 ICT 學習資源網</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f8fafc;
        }
        .card { transition: all 0.2s ease-in-out; }
        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgb(15 23 42 / 0.1), 0 4px 6px -2px rgb(15 23 42 / 0.05);
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="platform-page flex min-h-screen flex-col text-slate-800">
    <header class="platform-home-header sticky top-0 z-50 text-white shadow-lg">
        <div class="container mx-auto px-4 py-4">
            <div class="flex flex-col items-center justify-between gap-4 md:flex-row">
                <div class="flex items-center gap-3">
                    <i data-lucide="monitor-smartphone" class="h-8 w-8"></i>
                    <div>
                        <h1 id="site-name" class="text-2xl font-bold tracking-wide">ICT 學習資源網</h1>
                        <p id="site-tagline" class="text-xs text-indigo-200">高中資訊及通訊科技科</p>
                    </div>
                </div>

                <div class="flex w-full flex-col gap-2 sm:flex-row md:w-auto">
                    <a href="progress.html" class="inline-flex items-center justify-center gap-2 rounded-lg border border-indigo-400 bg-indigo-700 px-4 py-2 text-sm font-bold text-white transition hover:bg-indigo-600"><i data-lucide="bar-chart-3" class="h-4 w-4"></i>我的學習</a>
                    <form action="https://www.google.com/search" method="get" target="_blank"
                      class="flex w-full overflow-hidden rounded-lg border border-indigo-600 bg-indigo-800 transition focus-within:ring-2 focus-within:ring-white md:w-auto">
                    <input id="site-search-scope" type="hidden" name="sitesearch" value="">
                    <label for="google-search" class="sr-only">Google 內容搜尋</label>
                    <input id="google-search" type="text" name="q" placeholder="Google 內容搜尋..."
                           class="w-full bg-transparent px-4 py-2 text-white outline-none placeholder:text-indigo-300 md:w-64">
                    <button type="submit" aria-label="搜尋" class="bg-indigo-900 px-4 py-2 text-indigo-100 transition hover:bg-indigo-950">
                        <i data-lucide="search" class="h-5 w-5"></i>
                    </button>
                    </form>
                </div>
            </div>
        </div>
    </header>

    <main class="container mx-auto flex-grow px-4 py-8">
        <section class="mx-auto mb-10 max-w-4xl text-center" aria-labelledby="catalog-title">
            <h2 id="catalog-title" class="mb-4 text-3xl font-bold text-slate-800">課程與工具目錄</h2>
            <p class="mb-8 text-slate-500">所有卡片均連結至現有內容；可用標題、課程代號或關鍵字快速篩選。</p>

            <div class="relative mx-auto max-w-xl">
                <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3">
                    <i data-lucide="filter" class="h-5 w-5 text-gray-400"></i>
                </div>
                <label for="filterInput" class="sr-only">篩選課程與工具</label>
                <input id="filterInput" type="search"
                       class="block w-full rounded-xl border border-gray-200 bg-white py-3 pl-10 pr-3 text-sm leading-5 shadow-sm transition placeholder:text-gray-400 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                       placeholder="輸入關鍵字，例如 Python、SQL、網絡...">
            </div>
        </section>

        <section id="home-progress" class="mx-auto mb-10 max-w-6xl" aria-labelledby="home-progress-title"></section>

        <div id="course-container" class="mx-auto max-w-6xl space-y-12" aria-live="polite"></div>

        <div id="no-results" class="hidden py-12 text-center">
            <div class="mb-4 inline-flex h-16 w-16 items-center justify-center rounded-full bg-gray-100">
                <i data-lucide="file-question" class="h-8 w-8 text-gray-400"></i>
            </div>
            <h3 class="text-lg font-medium text-gray-900">找不到相關內容</h3>
            <p class="mt-2 text-gray-500">請嘗試使用不同的關鍵字。</p>
        </div>
    </main>

    <footer class="mt-auto bg-slate-900 py-8 text-slate-400">
        <div class="container mx-auto px-4 text-center">
            <p>&copy; 2025–2026 Ku Man chung. All rights reserved.</p>
            <p class="mt-2 text-xs text-slate-500">原創學習資源；並非官方網站。</p>
        </div>
    </footer>

    <script src="course_data.js?v=7"></script><script src="assets/js/progress_store.js?v=1"></script>

    <script src="assets/js/catalog.js?v=2"></script>
</body>
</html>
