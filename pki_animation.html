<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/platform.css?v=4">
    <link rel="stylesheet" href="assets/css/learning.css?v=5">
    <title>PKI 多場景互動教學</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap');
        
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f1f5f9;
            touch-action: pan-y;
        }

        .canvas-container {
            min-height: 600px;
            background: white;
            border-radius: 1.5rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            position: relative;
        }

        .draggable-key {
            cursor: grab;
            transition: all 0.2s;
            user-select: none;
            touch-action: none;
        }

        .draggable-key:active { cursor: grabbing; transform: scale(1.1); }

        .drop-zone {
            transition: all 0.3s;
            border: 3px dashed transparent;
        }

        .drop-zone.active-target {
            border-color: #3b82f6;
            background: rgba(59, 130, 246, 0.05);
            transform: scale(1.02);
        }

        .shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        .data-terminal {
            font-family: monospace;
            background: #0f172a;
            color: #10b981;
            border-radius: 0.5rem;
            padding: 0.75rem;
            font-size: 0.8rem;
            min-height: 80px;
            word-break: break-all;
        }

        .scenario-btn.active {
            background-color: #3b82f6;
            color: white;
            box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.5);
        }

        .eve-intercept-active {
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.4);
            border-color: #ef4444 !important;
        }
    </style>
</head>
<body class="p-4">
    <div class="max-w-6xl mx-auto">
        <header class="mb-6 text-center">
            <h1 class="text-2xl font-bold text-slate-800">PKI 互動實戰：加密與數碼簽署</h1>
            
            <!-- 場景切換器 -->
            <div class="flex justify-center gap-2 mt-4">
                <button id="btn-conf" onclick="switchScenario('confidentiality')" class="scenario-btn active px-4 py-2 rounded-full text-sm font-bold bg-white text-slate-600 transition-all border">🔐 傳輸加密 (保密性)</button>
                <button id="btn-auth" onclick="switchScenario('authentication')" class="scenario-btn px-4 py-2 rounded-full text-sm font-bold bg-white text-slate-600 transition-all border">✍️ 數碼簽署 (來源與完整性)</button>
            </div>
            <p class="platform-syllabus-note text-left max-w-3xl mx-auto">
                <strong>概念模型：</strong>實際數碼簽署通常先計算文件摘要（hash），再以簽署者的私人密碼匙處理摘要。此動畫簡化步驟，重點展示公開／私人密碼匙的角色；數碼簽署提供來源鑑定與完整性檢查，不會令內容保密。
            </p>
        </header>

        <div class="grid grid-cols-1 xl:grid-cols-4 gap-6">
            <!-- 側邊欄：密碼匙工具箱 -->
            <div class="xl:col-span-1 space-y-4">
                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                    <h3 class="font-bold text-slate-700 mb-3 text-sm flex items-center gap-2">📦 密碼匙工具箱</h3>
                    
                    <div class="space-y-3">
                        <!-- Alice -->
                        <div class="p-2 border border-red-100 rounded-lg bg-red-50/30">
                            <div class="text-[10px] font-bold text-red-500 mb-2">ALICE 持有的密碼匙</div>
                            <div class="flex gap-2">
                                <div id="key-alice-priv" draggable="true" class="draggable-key text-2xl p-2 bg-red-100 rounded border border-red-200" data-key="alice-priv" title="Alice 的私人密碼匙">🗝️</div>
                                <div id="key-bob-pub-alice" draggable="true" class="draggable-key text-2xl p-2 bg-white rounded border border-blue-200 text-blue-400" data-key="bob-pub" title="Bob 的公開密碼匙">🔑</div>
                            </div>
                        </div>

                        <!-- Bob -->
                        <div class="p-2 border border-blue-100 rounded-lg bg-blue-50/30">
                            <div class="text-[10px] font-bold text-blue-500 mb-2">BOB 持有的密碼匙</div>
                            <div class="flex gap-2">
                                <div id="key-bob-priv" draggable="true" class="draggable-key text-2xl p-2 bg-blue-100 rounded border border-blue-200" data-key="bob-priv" title="Bob 的私人密碼匙">🗝️</div>
                                <div id="key-alice-pub-bob" draggable="true" class="draggable-key text-2xl p-2 bg-white rounded border border-red-200 text-red-400" data-key="alice-pub" title="Alice 的公開密碼匙">🔑</div>
                            </div>
                        </div>

                        <!-- Eve -->
                        <div class="p-2 border border-slate-200 rounded-lg bg-slate-100">
                            <div class="text-[10px] font-bold text-slate-600 mb-2">EVE（攻擊者）的工具</div>
                            <div class="flex gap-2">
                                <div id="key-eve-priv" draggable="true" class="draggable-key text-2xl p-2 bg-slate-800 rounded border border-slate-900" data-key="eve-priv" title="Eve 的私人密碼匙">🗝️</div>
                                <div id="key-alice-pub-eve" draggable="true" class="draggable-key text-2xl p-2 bg-white rounded border border-red-200 text-red-400 opacity-60" data-key="alice-pub" title="公開取得的 Alice 公開密碼匙">🔑</div>
                                <div id="key-bob-pub-eve" draggable="true" class="draggable-key text-2xl p-2 bg-white rounded border border-blue-200 text-blue-400 opacity-60" data-key="bob-pub" title="公開取得的 Bob 公開密碼匙">🔑</div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                    <h3 class="font-bold text-slate-700 mb-2 text-sm">📡 數據流數據</h3>
                    <div id="sim-data" class="data-terminal">準備就緒...</div>
                </div>
                
                <button onclick="location.reload()" class="w-full py-2 bg-slate-200 hover:bg-slate-300 text-slate-600 rounded-lg text-xs font-bold transition-all">🔄 重置實驗室</button>
            </div>

            <!-- 主畫布 -->
            <div class="xl:col-span-3">
                <div class="canvas-container p-8 flex flex-col justify-between">
                    <!-- 角色層 -->
                    <div class="flex justify-around items-center">
                        <div class="text-center relative">
                            <div class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center text-3xl border-2 border-red-300">👩‍💻</div>
                            <span class="text-xs font-bold text-slate-600">Alice</span>
                        </div>
                        <div class="text-center">
                            <div id="eve-avatar" class="w-14 h-14 bg-slate-800 rounded-full flex items-center justify-center text-2xl border-2 border-slate-600 opacity-30 grayscale transition-all">🦹</div>
                            <span class="text-[10px] font-bold text-slate-400">Eve</span>
                        </div>
                        <div class="text-center">
                            <div class="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center text-3xl border-2 border-blue-300">👨‍💼</div>
                            <span class="text-xs font-bold text-slate-600">Bob</span>
                        </div>
                    </div>

                    <!-- 軌道層 -->
                    <div class="relative h-40 flex items-center px-12">
                        <div class="absolute inset-x-12 h-1 bg-slate-200 rounded-full"></div>
                        <div id="packet-path" class="absolute left-0 transition-all duration-700 ease-in-out" style="left: 0%;">
                            <div id="main-packet" class="drop-zone w-24 h-24 bg-white border-2 border-slate-200 rounded-xl shadow-lg flex flex-col items-center justify-center relative">
                                <span id="packet-icon" class="text-4xl">✉️</span>
                                <div id="status-badge" class="absolute -top-3 -right-3 text-2xl"></div>
                                <span id="packet-label" class="text-[9px] font-bold mt-2 text-slate-400">原始郵件</span>
                            </div>
                        </div>
                    </div>

                    <!-- 引導層 -->
                    <div id="guide-box" class="bg-blue-50 border-l-4 border-blue-500 p-4 rounded-r-lg shadow-sm transition-all duration-300">
                        <h4 id="guide-title" class="font-bold text-blue-800 mb-1">場景：傳輸加密</h4>
                        <p id="guide-text" class="text-blue-700 text-sm">請將 <b>Bob 的公開密碼匙 (藍色🔑)</b> 拖到郵件上來加密內容。</p>
                        <div class="flex gap-2 mt-3">
                            <button id="send-btn" class="hidden bg-blue-600 text-white px-4 py-1 rounded-full text-xs font-bold hover:bg-blue-700 transition-all">發送 ➔</button>
                            <button id="continue-btn" class="hidden bg-slate-600 text-white px-4 py-1 rounded-full text-xs font-bold hover:bg-slate-700 transition-all">數據繼續傳送 ➔</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 px-6 py-3 rounded-xl text-white font-bold shadow-2xl opacity-0 transition-all z-50 pointer-events-none"></div>

    <script>
        let currentScenario = 'confidentiality';
        let step = 1; // 1: Alice, 2: Eve (Middle), 3: Bob
        let isProcessed = false;
        const msg = "秘密：明天下午三點開會。";
        const encryptedMsg = "0xAF882D...[密文內容]";
        const signedMsg = "秘密：明天下午三點開會。\n[數碼簽署摘要: 0x92E1...]";

        function switchScenario(type) {
            currentScenario = type;
            step = 1;
            isProcessed = false;
            
            document.querySelectorAll('.scenario-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(type === 'confidentiality' ? 'btn-conf' : 'btn-auth').classList.add('active');
            
            resetUI();
        }

        function resetUI() {
            const packet = document.getElementById('main-packet');
            const path = document.getElementById('packet-path');
            
            path.style.left = "0%";
            packet.classList.remove('shake', 'eve-intercept-active');
            document.getElementById('status-badge').innerText = "";
            document.getElementById('packet-icon').innerText = "✉️";
            document.getElementById('packet-label').innerText = "原始郵件";
            document.getElementById('sim-data').innerText = msg;
            document.getElementById('sim-data').style.color = "#10b981";
            document.getElementById('send-btn').classList.add('hidden');
            document.getElementById('continue-btn').classList.add('hidden');
            document.getElementById('eve-avatar').classList.add('opacity-30', 'grayscale');
            
            if (currentScenario === 'confidentiality') {
                updateGuide("場景：傳輸加密", "目標：確保只有 Bob 能看見內容。請點按或拖曳 <b>Bob 的公開密碼匙 (藍色🔑)</b> 到郵件上進行加密。");
            } else {
                updateGuide("場景：數碼簽署", "目標：確認文件由持有 Alice 私人密碼匙的人簽署，而且內容未被更改。請點按或拖曳 <b>Alice 的私人密碼匙 (紅色🗝️)</b> 到郵件上進行簽署。");
            }
        }

        function updateGuide(title, text) {
            document.getElementById('guide-title').innerText = title;
            document.getElementById('guide-text').innerHTML = text;
        }

        // 密碼匙可拖放、點按或以鍵盤操作，照顧手機及鍵盤使用者。
        let draggedKey = null;
        document.querySelectorAll('.draggable-key').forEach(k => {
            k.setAttribute('role', 'button');
            k.setAttribute('tabindex', '0');
            k.setAttribute('aria-label', `${k.title}；按下以套用到目前封包`);
            k.addEventListener('dragstart', e => draggedKey = e.currentTarget.dataset.key);
            k.addEventListener('click', () => handleAction(k.dataset.key));
            k.addEventListener('keydown', event => {
                if (event.key === 'Enter' || event.key === ' ') {
                    event.preventDefault();
                    handleAction(k.dataset.key);
                }
            });
        });

        const dropTarget = document.getElementById('main-packet');
        dropTarget.addEventListener('dragover', e => {
            e.preventDefault();
            dropTarget.classList.add('active-target');
        });
        dropTarget.addEventListener('dragleave', () => dropTarget.classList.remove('active-target'));
        dropTarget.addEventListener('drop', e => {
            e.preventDefault();
            dropTarget.classList.remove('active-target');
            handleAction(draggedKey);
        });

        function handleAction(key) {
            if (step === 1) {
                // Alice 階段
                if (currentScenario === 'confidentiality') {
                    if (key === 'bob-pub') {
                        processStep("🔒", "已加密", encryptedMsg, "#f87171", "加密完成！請點擊下方按鈕發送封包。");
                    } else {
                        showToast("加密失敗！Alice 應使用 Bob 的公開密碼匙來『上鎖』。", "red");
                        shake(dropTarget);
                    }
                } else {
                    if (key === 'alice-priv') {
                        processStep("✍️", "已簽署", signedMsg, "#60a5fa", "簽署完成！請點擊發送，將帶有簽名的郵件送出。");
                    } else {
                        showToast("簽署失敗！應使用 Alice 自己的私人密碼匙產生有效簽署。", "red");
                        shake(dropTarget);
                    }
                }
            } else if (step === 2) {
                // Eve 攔截階段
                const eveAvatar = document.getElementById('eve-avatar');
                if (key === 'eve-priv') {
                    showToast("Eve 嘗試用自己的私人密碼匙解密……失敗！密文並非以她的公開密碼匙加密。", "red");
                    shake(eveAvatar);
                    updateDataDisplay("[ERROR] 無法解密：密鑰不正確", "#ef4444");
                    setTimeout(() => updateDataDisplay(currentScenario === 'confidentiality' ? encryptedMsg : signedMsg, currentScenario === 'confidentiality' ? "#f87171" : "#60a5fa"), 1200);
                } else if (key === 'alice-pub' || key === 'bob-pub') {
                    showToast(currentScenario === 'confidentiality'
                        ? "公開密碼匙可以公開取得，但不能解開以 Bob 公開密碼匙加密的內容。"
                        : "Alice 的公開密碼匙可以驗證簽署，但不能產生 Alice 的有效簽署或暗中修改文件。", "orange");
                    shake(eveAvatar);
                }
            } else if (step === 3) {
                // Bob 階段
                if (currentScenario === 'confidentiality') {
                    if (key === 'bob-priv') {
                        finish("📖", "已還原", msg, "#10b981", "Bob 使用自己的私人密碼匙順利解開密文！");
                    } else {
                        showToast("解密失敗！只有 Bob 的私人密碼匙能解開這封信。", "red");
                        shake(dropTarget);
                    }
                } else {
                    if (key === 'alice-pub') {
                        finish("✅", "已驗證", msg, "#10b981", "驗證成功！Bob 使用 Alice 的公開密碼匙確認簽署有效，而且文件內容未被更改。");
                    } else {
                        showToast("驗證失敗！需使用 Alice 的公開密碼匙來驗證簽署。", "red");
                        shake(dropTarget);
                    }
                }
            }
        }

        function processStep(badge, label, data, color, guide) {
            document.getElementById('status-badge').innerText = badge;
            document.getElementById('packet-label').innerText = label;
            document.getElementById('sim-data').innerText = data;
            document.getElementById('sim-data').style.color = color;
            document.getElementById('send-btn').classList.remove('hidden');
            document.getElementById('guide-text').innerText = guide;
            isProcessed = true;
        }

        document.getElementById('send-btn').onclick = () => {
            const path = document.getElementById('packet-path');
            const packet = document.getElementById('main-packet');
            const eveAvatar = document.getElementById('eve-avatar');
            
            // 移動到中間 (Eve)
            path.style.left = "calc(50% - 48px)";
            document.getElementById('send-btn').classList.add('hidden');
            step = 2;
            
            setTimeout(() => {
                eveAvatar.classList.remove('opacity-30', 'grayscale');
                packet.classList.add('eve-intercept-active');
                updateGuide("⚠️ 數據被攔截！", "封包目前在攻擊者 Eve 手中。試用她自己的私人密碼匙或公開取得的密碼匙，觀察哪些操作可以成功。");
                document.getElementById('continue-btn').classList.remove('hidden');
            }, 700);
        };

        document.getElementById('continue-btn').onclick = () => {
            const path = document.getElementById('packet-path');
            const packet = document.getElementById('main-packet');
            
            packet.classList.remove('eve-intercept-active');
            path.style.left = "calc(100% - 110px)";
            document.getElementById('continue-btn').classList.add('hidden');
            step = 3;
            
            setTimeout(() => {
                if (currentScenario === 'confidentiality') {
                    updateGuide("Bob 已收到密文", "數據已送達。請點按或拖曳 <b>Bob 的私人密碼匙 (藍色🗝️)</b> 到封包上解密內容。");
                } else {
                    updateGuide("Bob 已收到簽署文件", "數據已送達。請點按或拖曳 <b>Alice 的公開密碼匙 (紅色🔑)</b> 到封包上驗證簽署及文件完整性。");
                }
            }, 700);
        };

        function finish(icon, label, data, color, guide) {
            document.getElementById('packet-icon').innerText = icon;
            document.getElementById('packet-label').innerText = label;
            document.getElementById('sim-data').innerText = data;
            document.getElementById('sim-data').style.color = color;
            document.getElementById('status-badge').innerText = "";
            updateGuide("實驗成功！", guide + "<br><br><b>小結：</b>" + 
                (currentScenario === 'confidentiality' ? "即使攻擊者攔截密文並取得公開密碼匙，沒有 Bob 的私人密碼匙仍無法解密內容。" : "有效的數碼簽署顯示文件由持有 Alice 私人密碼匙的人簽署，並可偵測簽署後的內容改動。"));
        }

        function updateDataDisplay(text, color) {
            const el = document.getElementById('sim-data');
            el.innerText = text;
            el.style.color = color;
        }

        function showToast(m, c) {
            const t = document.getElementById('toast');
            t.innerText = m;
            t.style.backgroundColor = c === 'red' ? '#ef4444' : (c === 'orange' ? '#f59e0b' : '#3b82f6');
            t.classList.add('opacity-100');
            setTimeout(() => t.classList.remove('opacity-100'), 2500);
        }

        function shake(el) {
            el.classList.add('shake');
            setTimeout(() => el.classList.remove('shake'), 500);
        }

        resetUI();
    </script>
    <script src="course_data.js?v=6"></script>
    <script src="assets/js/site_navigation.js?v=5"></script>
    <script src="learning_data.js?v=13"></script>
    <script src="assets/js/lesson_companion.js?v=7"></script>
</body>
</html>
